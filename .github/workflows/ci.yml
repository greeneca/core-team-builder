name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The handler integration tests run against this database. It is created
    # fresh for every job, so the tests are free to drop and rebuild its schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctb
          POSTGRES_PASSWORD: ctb
          POSTGRES_DB: ctb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctb -d ctb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # TEST_DATABASE_URL opts the handler integration tests in; without it they
      # skip and only the unit tests run. See internal/handlers/testdb_test.go.
      - name: Test
        run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://ctb:ctb@localhost:5432/ctb_test?sslmode=disable
